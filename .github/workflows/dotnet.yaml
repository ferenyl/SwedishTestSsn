# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET Core CI

on:
  push:
    branches: [main]
  release:
    types: [published]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # update release
      pull-requests: read # changelog
      id-token: write # nuget trusted publishing

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release  --no-restore

      - name: Run SwedishTestSsn.Client.Test exe
        run: |
          chmod +x ./src/SwedishTestSsn.Client.Test/bin/Release/net10.0/SwedishTestSsn.Client.Test
          ./src/SwedishTestSsn.Client.Test/bin/Release/net10.0/SwedishTestSsn.Client.Test

      - name: Get version
        id: get_version
        run: echo "NEW_VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Set version to tag
        id: bump_version
        env:
          NEW_VERSION: ${{ steps.get_version.outputs.NEW_VERSION }}
        run: |
          sed -i "s/<AssemblyVersion>.*<\/AssemblyVersion>/<AssemblyVersion>$NEW_VERSION<\/AssemblyVersion>/g" ./src/SwedishTestSsn/SwedishTestSsn.csproj ./src/SwedishTestSsn.Client/SwedishTestSsn.Client.csproj
        if: startsWith(github.ref, 'refs/tags/v')

      - name: Pack
        run: dotnet pack SwedishTestSsn.slnx --configuration Release --output ./artifacts
        if: startsWith(github.ref, 'refs/tags/v')

      - name: Build changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          configuration: .github/changelog-config.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: startsWith(github.ref, 'refs/tags/v')

      - name: Update release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.changelog.outputs.changelog }}
          files: ./artifacts/*.nupkg
        if: startsWith(github.ref, 'refs/tags/v')

      - name: NuGet login
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
        if: startsWith(github.ref, 'refs/tags/v')

      - name: Push
        run: dotnet nuget push "./artifacts/*.nupkg" --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
        if: startsWith(github.ref, 'refs/tags/v')
