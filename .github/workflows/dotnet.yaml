# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET Core CI

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create release
      id-token: write # nuget trusted publishing

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release  --no-restore

      - name: Run SwedishTestSsn.Client.Test exe
        run: |
          chmod +x ./src/SwedishTestSsn.Client.Test/bin/Release/net10.0/SwedishTestSsn.Client.Test
          ./src/SwedishTestSsn.Client.Test/bin/Release/net10.0/SwedishTestSsn.Client.Test

      - name: Get version
        id: get_version
        run: echo "NEW_VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Set version to tag
        id: bump_version
        env:
          NEW_VERSION: ${{ steps.get_version.outputs.NEW_VERSION }}
        run: |
          sed -i "s/<AssemblyVersion>.*<\/AssemblyVersion>/<AssemblyVersion>$NEW_VERSION<\/AssemblyVersion>/g" ./src/SwedishTestSsn/SwedishTestSsn.csproj ./src/SwedishTestSsn.Client/SwedishTestSsn.Client.csproj
        if: startsWith(github.ref, 'refs/tags/v')

      - name: Pack
        run: dotnet pack SwedishTestSsn.slnx --configuration Release --output ./artifacts
        if: startsWith(github.ref, 'refs/tags/v')

      - name: Generate release notes
        id: release_notes
        run: |
          # Get commit messages since last tag
          RELEASE_NOTES="$(git log $(git describe --tags --abbrev=0)..HEAD --pretty=format:"- %s")"

          # Set output
          echo  "NOTES=$RELEASE_NOTES >> $GITHUB_OUTPUT"
        if: startsWith(github.ref, 'refs/tags/v')

      - name: create release
        uses: ncipollo/release-action@v1.21.0
        with:
          artifacts: "./artifacts/*.nupkg"
          body: ${{ steps.release_notes.outputs.NOTES }}
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: v${{ steps.get_version.outputs.NEW_VERSION }}
          prerelease: false
          draft: false
          name: Release v${{ steps.get_version.outputs.NEW_VERSION }}
          generateReleaseNotes: true
        if: startsWith(github.ref, 'refs/tags/v')

      - name: NuGet login
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
        if: startsWith(github.ref, 'refs/tags/v')

      - name: Push
        run: dotnet nuget push "./artifacts/*.nupkg" --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
        if: startsWith(github.ref, 'refs/tags/v')
